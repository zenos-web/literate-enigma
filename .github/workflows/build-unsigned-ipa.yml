# 放到仓库的 .github/workflows/build-unsigned-ipa.yml
# 用途：没有 Mac 时，用 GitHub 的 macOS 运行器云端编译出未签名 IPA
# 触发：推送到 main 自动编译，也可在 Actions 页手动 Run workflow
name: Build unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build unsigned .app
        run: |
          set -euo pipefail
          python3 Tools/generate_project.py || true
          xcodebuild \
            -project TDSCarKit.xcodeproj \
            -scheme TDSCarKit \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP"
          lipo -info "$APP/TDSCarKit"
          mkdir -p Payload
          cp -R "$APP" Payload/
          rm -f "Payload/$(basename "$APP")/embedded.mobileprovision"
          zip -qry CarWithin-1.0.5-unsigned.ipa Payload
          unzip -l CarWithin-1.0.5-unsigned.ipa | head -12
          shasum -a 256 CarWithin-1.0.5-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: CarWithin-1.0.5-unsigned
          path: CarWithin-1.0.5-unsigned.ipa
          if-no-files-found: error

      - name: Publish IPA as release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v1.0.5-build${{ github.run_number }}-${{ github.run_attempt }}"
          gh release create "$TAG" \
            CarWithin-1.0.5-unsigned.ipa \
            --title "CarWithin 1.0.5 unsigned (build ${{ github.run_number }})" \
            --notes "未签名 IPA，需要用侧载工具以自己的证书签名后安装。最低系统 iOS 16.0。" \
            --repo "${{ github.repository }}"
