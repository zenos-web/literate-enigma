# 放到仓库的 .github/workflows/build-unsigned-ipa.yml
# 用途：没有 Mac 时，用 GitHub 的 macOS 运行器云端编译出未签名 IPA
# 触发：推送到 main 自动编译，也可在 Actions 页手动 Run workflow
name: Build unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build unsigned .app
        run: |
          set -euo pipefail
          python3 Tools/generate_project.py || true
          xcodebuild \
            -project TDSCarKit.xcodeproj \
            -scheme TDSCarKit \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP"
          lipo -info "$APP/TDSCarKit"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry CarWithin-1.0.3-unsigned.ipa Payload
          shasum -a 256 CarWithin-1.0.3-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: CarWithin-1.0.3-unsigned
          path: CarWithin-1.0.3-unsigned.ipa
          if-no-files-found: error
